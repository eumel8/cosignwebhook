name: End2End Testing
on: [push]

jobs:
  end2end:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v6
    - name: Install go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.3'
    - name: Install k3d
      run: |
        curl -s https://raw.githubusercontent.com/rancher/k3d/main/install.sh | bash
        k3d version
    - name: Trust k3d registry in Docker daemon
      # Docker 29 (ubuntu-26 runners) uses the containerd image store by default,
      # which only speaks plain HTTP to registries listed as insecure-registries.
      # The k3d registry is plain HTTP, so trust it before creating anything.
      run: |
        sudo mkdir -p /etc/docker
        sudo tee /etc/docker/daemon.json <<'EOF'
        {
          "insecure-registries": ["k3d-registry.localhost:5000"]
        }
        EOF
        sudo systemctl restart docker
        sudo systemctl is-active docker
    - name: Create Cluster & Registry
      run: |
          make e2e-cluster
    - name: Check Cluster Nodes
      run: |
        kubectl get nodes
    - name: Check Coredns Deployment
      run: |
        kubectl -n kube-system rollout status deployment/coredns --timeout=60s
        STATUS=$(kubectl -n kube-system get deployment coredns -o jsonpath={.status.readyReplicas})
        if [[ $STATUS  -ne  1 ]]
        then
          echo "Deployment coredns not ready"
          kubectl -n kube-system get events
          exit 1
        else
          echo "Deployment coredns OK"
        fi
    - name: Check Metricsserver Deployment
      run: |
        kubectl -n kube-system rollout status deployment/metrics-server --timeout=60s
        STATUS=$(kubectl -n kube-system get deployment metrics-server -o jsonpath={.status.readyReplicas})
        if [[ $STATUS  -ne  1 ]]
        then
          echo "Deployment metrics-server not ready"
          kubectl -n kube-system get events
          exit 1
        else
          echo "Deployment metrics-server OK"
        fi
    - name: Setup Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version
    - name: Install Cosign
      uses: sigstore/cosign-installer@main
      with:
        cosign-release: 'v3.0.6'
    - name: Create ephemeral keys
      run: |
        make e2e-keys
      env:
        COSIGN: cosign
    - name: Build test image
      run: |
        make e2e-images
      env:
        COSIGN: cosign
    - name: Install Cosignwebhook
      run: |
        make e2e-deploy
    - name: Run End2End Tests
      run: |
        go mod download
        make test-e2e
