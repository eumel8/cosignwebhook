{{- $altNames := list ( printf "%s.%s" (include "cosignwebhook.fullname" .) .Release.Namespace ) ( printf "%s.%s.svc" (include "cosignwebhook.fullname" .) .Release.Namespace ) -}}
{{- $ca := genCA "cosign-webhook-ca" 3650 -}}
{{- $cert := genSignedCert ( include "cosignwebhook.fullname" . ) nil $altNames 3650 $ca -}}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ include "cosignwebhook.fullname" . }}
  labels:
    {{- include "cosignwebhook.labels" . | nindent 4 }}
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "cosignwebhook.fullname" . }}
webhooks:
  - admissionReviewVersions:
    - v1
    name: {{ .Values.admission.webhook.name }}
    matchPolicy: {{ .Values.admission.matchPolicy }}
    {{- $releaseNs := .Release.Namespace | default "default" }}
    {{- $exempt := dict }}
    {{- range $key, $values := .Values.admission.exemptNamespaceLabels }}
    {{- $_ := set $exempt $key (ternary $values (list $values) (kindIs "slice" $values)) }}
    {{- end }}
    {{- $nsNameKey := "kubernetes.io/metadata.name" }}
    {{- $_ := set $exempt $nsNameKey (append (get $exempt $nsNameKey | default (list)) $releaseNs | uniq) }}
    namespaceSelector:
      matchExpressions:
        {{- range $key, $values := $exempt }}
        - key: {{ $key | quote }}
          operator: NotIn
          values:
            {{- range $values }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
    clientConfig:
      service:
        name: {{ include "cosignwebhook.fullname" . }}
        namespace: {{ .Release.Namespace | default "default" }}
        path: "/validate"
        port: 443
      caBundle: {{ $ca.Cert | b64enc }}
    rules:
      - operations: ["CREATE","UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "*"
    objectSelector: {}
    failurePolicy: {{ .Values.admission.failurePolicy }}
    sideEffects: {{ .Values.admission.sideEffects }}
    timeoutSeconds: {{ .Values.admission.timeoutSeconds }}
